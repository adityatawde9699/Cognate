name: Test & Lint

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_call:

jobs:
  test:
    name: Run Tests & Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build web application
        run: npm run build

      - name: Verify build contains no local data
        run: npm run verify:build

      - name: Run JS tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Verify offline production shell
        run: npm run test:pwa

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          workspaces: |
            src-tauri -> target
            server -> target
          cache-on-failure: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus-x11 gnome-keyring

      - name: Check Rust formatting
        working-directory: src-tauri
        continue-on-error: true # Might fail if rustfmt isn't perfectly satisfied initially
        run: |
          cargo fmt -- --check || echo "Formatting not strictly required but recommended."

      - name: Check Rust linting
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      # The E2E sync relay is a separate, dependency-light crate (server/).
      # It must be linted and tested on its own so the sync spine stays green.
      - name: Check relay linting
        working-directory: server
        run: cargo clippy -- -D warnings

      - name: Run relay tests
        working-directory: server
        run: cargo test

      - name: Check production Rust and TypeScript planner parity
        run: npm run test:parity

      - name: Measure task and operation regression budgets
        env:
          COGNATE_BENCH_CHECK: '1'
        run: npm run benchmark -- test-results/benchmark.json

      - name: Measure real relay and verify hard-kill recovery
        env:
          COGNATE_BENCH_CHECK: '1'
        run: npm run benchmark:relay -- test-results/relay-benchmark.json

      - name: Install native WebDriver
        run: cargo install tauri-driver --version 2.0.5 --locked

      - name: Build isolated native smoke application
        run: npm run tauri build -- --no-bundle --config src-tauri/tauri.smoke.conf.json -- --bin cognate

      - name: Exercise real Linux webview, keychain and crash recovery
        run: |
          # A fresh runner has no login keyring. Use a throwaway HOME and
          # initialize a CI-only keyring so Secret Service writes are real,
          # while keeping every credential and profile out of runner state.
          export HOME="$RUNNER_TEMP/cognate-native-home"
          mkdir -p "$HOME"
          dbus-run-session -- xvfb-run -a bash -c 'printf "cognate-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets; dbus-update-activation-environment --all; npm run test:native'

      - name: Upload reliability and measurement evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reliability-linux
          path: test-results/
          retention-days: 14

  native-contracts:
    name: Native contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Native storage, migration, recovery and AI contracts
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Native lint checks
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Production planner parity
        run: npm run test:parity
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-contracts-${{ matrix.os }}
          path: test-results/planner-parity.json
