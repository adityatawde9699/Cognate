[package]
name    = "cognate"
default-run = "cognate"
version = "3.1.0-rc.7"
description = "Cognate — Cross-platform Smart Task Manager"
authors = []
edition = "2021"
rust-version = "1.77.2"

# Shared library for mobile targets
[lib]
name       = "cognote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cognate"
path = "src/main.rs"

[[bin]]
name = "planner-fixture"
path = "src/bin/planner-fixture.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-sql          = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-oauth = "2.0.0-rc"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
chrono = "0.4"
libsqlite3-sys = "=0.30.1"
# Raw backup handles require matching SQLx/SQLite ABI versions.
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
llama-cpp-2 = { version = "0.1.161", default-features = false, optional = true }
sha2 = "0.10.9"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[features]
# Built-in llama.cpp inference: runs GGUF models inside the app, no separate
# server. Compiles llama.cpp from source (needs cmake, a C++ compiler, libclang).
default = ["embedded-llm"]
embedded-llm = ["dep:llama-cpp-2"]
# GPU acceleration (Linux/Windows release builds). CUDA is built as a module that
# is loaded at run time: with an NVIDIA GPU and driver it offloads the model,
# otherwise the module simply does not load and the CPU path runs. Needs the
# CUDA toolkit at build time; the backend modules must ship next to the app
# (see docs/LOCAL_LLM.md).
embedded-llm-gpu = ["embedded-llm", "llama-cpp-2/cuda", "llama-cpp-2/dynamic-backends"]
