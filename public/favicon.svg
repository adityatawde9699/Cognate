<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cognate">
  <title>Cognate</title>
  <!--
    The day-arc C: a 24-hour dial. The 255° emerald arc is the default work
    hours (06:00 → 23:00, 17 waking hours); the 105° gap is sleep; the dot in
    the mouth is the "now" marker from the plan timeline.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c21"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#34d399" stroke-opacity="0.18" stroke-width="5"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#arc)" stroke-width="88"
          pathLength="360" stroke-dasharray="255 105" stroke-dashoffset="-52.5"/>
  <circle cx="404" cy="256" r="28" fill="#6ee7b7"/>
</svg>
