<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cognate">
  <title>Cognate</title>
  <!-- Full-bleed maskable variant of the day-arc C; the mark stays inside the 80% safe zone. -->
  <defs>
    <linearGradient id="tile-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c21"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="arc-m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow-m" cx="0.5" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile-m)"/>
  <rect width="512" height="512" fill="url(#glow-m)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#arc-m)" stroke-width="82"
          pathLength="360" stroke-dasharray="255 105" stroke-dashoffset="-52.5"/>
  <circle cx="396" cy="256" r="26" fill="#6ee7b7"/>
</svg>
