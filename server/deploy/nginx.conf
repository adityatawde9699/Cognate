# Include inside nginx's http context. Replace hostname and certificate paths.
limit_conn_zone $binary_remote_addr zone=cognate_clients:10m;
limit_conn_zone $server_name zone=cognate_total:1m;
server {
    listen 443 ssl;
    server_name relay.example;
    ssl_certificate /etc/letsencrypt/live/relay.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn cognate_clients 8;
    limit_conn cognate_total 128;
    location / {
        # Buffer slow uploads before handing them to the bounded relay workers.
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 35s;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
server {
    listen 80;
    server_name relay.example;
    return 308 https://$host$request_uri;
}
